<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Smart MIDI Piano Studio Pro</title>

  <!-- VexFlow 4.2.2 -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>

  <!-- Tone.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 16px;
      max-width: 1100px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    h2 {
      margin-top: 4px;
      margin-bottom: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    select,
    button,
    input {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      font-size: 13px;
      background: #334155;
      color: #fff;
      cursor: pointer;
      outline: none;
      width: 100%;
    }

    button {
      background: #2563eb;
      border: none;
      font-weight: 600;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .feature-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .feature-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feature-group input[type="number"] {
      width: 65px;
      text-align: center;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-top: 14px;
      font-size: 13px;
    }

    .stat-val {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
    }

    #notation-viewport {
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;
      width: 100%;
      min-height: 180px;
      display: block;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      text-align: left;
    }

    #notation-viewport svg {
      display: block;
      min-width: 320px;
    }

    .feedback-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
    }

    #matchStatus {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #94a3b8;
    }

    #matchStatus.correct {
      color: #10b981;
    }

    #matchStatus.incorrect {
      color: #ef4444;
    }

    .status-text {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .progression-banner {
      margin-top: 10px;
      padding: 8px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
    }

    .error-banner {
      background: #450a0a;
      color: #fecaca;
      border: 1px solid #7f1d1d;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 12px;
      display: none;
      text-align: left;
    }

    .piano-container {
      display: flex;
      justify-content: center;
      margin-top: 14px;
      position: relative;
      user-select: none;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }

    .key {
      display: inline-block;
      position: relative;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: none;
    }

    .key.white {
      width: 32px;
      height: 100px;
      background: #fff;
      border: 1px solid #cbd5e1;
      z-index: 1;
    }

    .key.black {
      width: 20px;
      height: 60px;
      background: #1e293b;
      margin-left: -10px;
      margin-right: -10px;
      z-index: 2;
    }

    .key.active {
      background: #3b82f6 !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 6px;
      }

      .card {
        padding: 10px;
      }

      .key.white {
        width: 28px;
      }

      .key.black {
        width: 18px;
        margin-left: -9px;
        margin-right: -9px;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Smart MIDI Piano Studio Pro</h2>

  <div class="controls">

    <select id="keySelect"></select>

    <select id="clefSelect">
      <option value="treble">Treble Clef (🎼)</option>
      <option value="bass">Bass Clef (𝄢)</option>
    </select>

    <select id="genreSelect">
      <option value="custom">Custom Manual Mode</option>
      <option value="ex_boogie">🎹 Boogie-Woogie Bass Patterns</option>
      <option value="ex_walking">🎷 Walking Bass Lines</option>
      <option value="ex_blues_licks">🎸 Blues Licks & Pentatonic Runs</option>
      <option value="ex_ninths">★ ALL 9th Chords Mix</option>
      <option value="ex_sixths">★ 6th Chords Mix</option>
      <option value="ex_aug_dim">★ Aug & Dim Triads Mix</option>
      <option value="ex_all_triads">★ ALL Triads Mix</option>
      <option value="ex_all_sevenths">★ ALL 7th Chords Mix</option>
      <option value="ex_shells">★ Jazz Shell Voicings Mix</option>
      <option value="ex_triads_power">★ Triads + Power Chords Mix</option>
      <option value="ex_all_chords">★ ULTIMATE MIX</option>
      <option value="ex_inversions">Random Inversions</option>
      <option value="ex_sus">Exercise: All Sus Chords</option>
      <option value="ex_minor">Exercise: All Minor Chords</option>
      <option value="ex_dim">Exercise: All Diminished Chords</option>
      <option value="ex_aug">Exercise: All Augmented Chords</option>
      <option value="ex_power">Exercise: Power Chords</option>
      <option value="ex_maj7">Exercise: Major 7th Chords</option>
      <option value="ex_m7">Exercise: Minor 7th Chords</option>
      <option value="ex_dom7">Exercise: Dominant 7th Chords</option>
      <option value="diatonic">Diatonic Triads</option>
      <option value="pop">Pop Progression</option>
      <option value="blues">Blues Progression</option>
      <option value="jazz">Jazz Progression</option>
    </select>

    <select id="chordsPerPage">
      <option value="1">1 Measure</option>
      <option value="2">2 Measures</option>
      <option value="4" selected>4 Measures</option>
      <option value="6">6 Measures</option>
      <option value="8">8 Measures</option>
      <option value="10">10 Measures</option>
    </select>

    <select id="modeSelect">
      <option value="chord">Block Chord</option>
      <option value="broken">Broken Chord</option>
      <option value="arpeggio">Arpeggio / Sequence</option>
      <option value="single">Single Note</option>
    </select>

    <select id="rhythmSelect">
      <option value="w">Whole Notes (1/1)</option>
      <option value="h">Half Notes (1/2)</option>
      <option value="q" selected>Quarter Notes (1/4)</option>
      <option value="8">Eighth Notes (1/8)</option>
    </select>

    <select id="typeSelect">
      <option value="Major">Major Triad</option>
      <option value="Minor">Minor Triad</option>
      <option value="Aug">Augmented</option>
      <option value="Dim">Diminished</option>
      <option value="Sus2">Sus2</option>
      <option value="Sus4">Sus4</option>
      <option value="Maj6">Major 6th</option>
      <option value="m6">Minor 6th</option>
      <option value="Dom7">Dominant 7th</option>
      <option value="Maj7">Major 7th</option>
      <option value="m7">Minor 7th</option>
      <option value="m7b5">Half-Diminished 7th</option>
      <option value="dim7">Fully-Diminished 7th</option>
      <option value="Dom9">Dominant 9th</option>
      <option value="Maj9">Major 9th</option>
      <option value="m9">Minor 9th</option>
      <option value="Add9">Add 9</option>
      <option value="Shell3">Shell Root-3rd-7th</option>
      <option value="Shell7">Shell Root-7th-3rd</option>
      <option value="Power">Power Chord</option>
      <option value="PowerOct">Power Chord + Octave</option>
    </select>

    <select id="inversionSelect">
      <option value="0">Root Position</option>
      <option value="1">1st Inversion</option>
      <option value="2">2nd Inversion</option>
      <option value="3">3rd Inversion</option>
      <option value="4">4th Inversion</option>
    </select>

    <button id="nextChordBtn" style="display:none;">
      Next Measure ➔
    </button>

    <button id="enableAudio">
      Enable Sound
    </button>

  </div>

  <div class="feature-bar">

    <div class="feature-group">
      <span>🥁 Metronome:</span>

      <button id="toggleMetronomeBtn">
        Start Click
      </button>

      <input
        type="number"
        id="bpmInput"
        value="100"
        min="40"
        max="240">

      <span>BPM</span>
    </div>

    <div class="feature-group">

      <span>🔄 Transpose:</span>

      <button id="transDownBtn">-1</button>

      <span
        id="transValDisplay"
        style="font-weight:bold;color:#38bdf8;">
        0 ST
      </span>

      <button id="transUpBtn">+1</button>

    </div>

    <div class="feature-group">

      <button id="flowModeBtn">
        Flow Mode: OFF
      </button>

    </div>

  </div>

  <div
    id="progressionDisplay"
    class="progression-banner"
    style="display:none;">

    Analysis:
    <span id="romanText">-</span>

  </div>

  <div id="notation-viewport"></div>

  <div id="notationError" class="error-banner"></div>

  <div class="stats-bar">

    <div>
      Attempts:
      <div class="stat-val" id="statAttempts">0</div>
    </div>

    <div>
      Accuracy:
      <div class="stat-val" id="statAccuracy">100%</div>
    </div>

    <div>
      Avg Speed:
      <div class="stat-val" id="statSpeed">0.0s</div>
    </div>

  </div>

  <div class="feedback-box">

    <div id="matchStatus">
      Play target notes on your keyboard...
    </div>

    <div class="status-text">
      Target Notes:
      <span id="targetNotes" style="color:#60a5fa;">
        -
      </span>
      |
      Active Played:
      <span id="playedNotes" style="color:#f59e0b;">
        None
      </span>
    </div>

    <div
      class="status-text"
      style="margin-top:4px;">

      MIDI Connection:
      <span id="midiStatus">
        Checking...
      </span>

    </div>

  </div>

  <div
    class="piano-container"
    id="keyboard">
  </div>

</div>

<script>
  const VF = Vex.Flow;
  const synth = new Tone.PolySynth().toDestination();
  const clickSynth = new Tone.MembraneSynth().toDestination();

  let audioEnabled = false;
  let isMetronomeRunning = false;
  let metronomeEventId = null;

  let totalAttempts = 0;
  let correctAttempts = 0;
  let chordStartTime = Date.now();
  let totalResponseTime = 0;

  let hasEvaluatedCurrentChord = false;
  let transposeSemitones = 0;
  let isFlowModeActive = false;
  let flowTimerInterval = null;

  let activeMidiNotes = new Set();
  let targetMidiSet = new Set();
  let chordWasCompleted = false;
  let currentProgressionStep = 0;

  const NOTE_NAMES = ['c', 'c#', 'd', 'd#', 'e', 'f', 'f#', 'g', 'g#', 'a', 'a#', 'b'];
  const DISPLAY_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  const CHORD_OFFSETS = {
    Major: [0, 4, 7],
    Minor: [0, 3, 7],
    Aug: [0, 4, 8],
    Dim: [0, 3, 6],
    Sus2: [0, 2, 7],
    Sus4: [0, 5, 7],
    Maj6: [0, 4, 7, 9],
    m6: [0, 3, 7, 9],
    Dom7: [0, 4, 7, 10],
    Maj7: [0, 4, 7, 11],
    m7: [0, 3, 7, 10],
    m7b5: [0, 3, 6, 10],
    dim7: [0, 3, 6, 9],
    Dom9: [0, 4, 7, 10, 14],
    Maj9: [0, 4, 7, 11, 14],
    m9: [0, 3, 7, 10, 14],
    Add9: [0, 4, 7, 14],
    Shell3: [0, 4, 10],
    Shell7: [0, 10, 16],
    Power: [0, 7],
    PowerOct: [0, 7, 12]
  };

  const KEY_ROOTS = {
    C: 0, 'C#': 1, Db: 1, D: 2, Eb: 3, E: 4, F: 5,
    'F#': 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11
  };

  const DIATONIC_SCALE_ROOTS = [0, 2, 4, 5, 7, 9, 11];

  const GENRE_PROGRESSIONS = {
    diatonic: {
      roman: ['I (Tonic)', 'IV (Subdominant)', 'V (Dominant)'],
      roots: [0, 5, 7],
      types: ['Major', 'Major', 'Major']
    },
    ex_boogie: {
      roman: ['I Boogie', 'IV Boogie', 'V Boogie'],
      customPatterns: [
        [0, 7, 9, 7],
        [5, 12, 14, 12],
        [7, 14, 16, 14]
      ]
    },
    ex_walking: {
      roman: ['I Walking', 'IV Walking', 'V Walking'],
      customPatterns: [
        [0, 4, 7, 9],
        [5, 9, 12, 14],
        [7, 11, 14, 16]
      ]
    },
    ex_blues_licks: {
      roman: ['Minor Blues Lick', 'Blues Lick', 'Blues Resolution'],
      customPatterns: [
        [0, 3, 5],
        [6, 7, 10],
        [12, 10, 7]
      ]
    },
    ex_ninths: {
      roman: ['Imaj9', 'IVmaj9', 'V9', 'iim9'],
      roots: [0, 5, 7, 2],
      types: ['Maj9', 'Maj9', 'Dom9', 'm9']
    },
    ex_sixths: {
      roman: ['I6', 'IV6', 'iv6', 'V6'],
      roots: [0, 5, 5, 7],
      types: ['Maj6', 'Maj6', 'm6', 'Maj6']
    },
    ex_aug_dim: {
      roman: ['I Aug', 'vii Dim', 'IV Aug', 'vii Dim7'],
      roots: [0, 11, 5, 11],
      types: ['Aug', 'Dim', 'Aug', 'dim7']
    },
    ex_shells: {
      roman: ['ii7 Shell', 'V7 Shell', 'Imaj7 Shell'],
      roots: [2, 7, 0],
      types: ['Shell3', 'Shell7', 'Shell3']
    },
    ex_inversions: {
      roman: ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
      roots: [0, 2, 4, 5, 7, 9, 11],
      types: ['Major', 'Minor', 'Minor', 'Major', 'Major', 'Minor', 'Dim']
    },
    ex_sus: {
      roman: ['I Sus2', 'I Sus4', 'IV Sus2', 'V Sus4'],
      roots: [0, 0, 5, 7],
      types: ['Sus2', 'Sus4', 'Sus2', 'Sus4']
    },
    ex_minor: {
      roman: ['ii Minor', 'iii Minor', 'vi Minor'],
      roots: [2, 4, 9],
      types: ['Minor', 'Minor', 'Minor']
    },
    ex_dim: {
      roman: ['vii° Dim', 'vii°7 Dim7'],
      roots: [11, 11],
      types: ['Dim', 'dim7']
    },
    ex_aug: {
      roman: ['I Aug', 'IV Aug', 'V Aug'],
      roots: [0, 5, 7],
      types: ['Aug', 'Aug', 'Aug']
    },
    ex_power: {
      roman: ['I Power', 'I Power + Oct', 'IV Power', 'V Power + Oct'],
      roots: [0, 0, 5, 7],
      types: ['Power', 'PowerOct', 'Power', 'PowerOct']
    },
    ex_maj7: {
      roman: ['I maj7', 'IV maj7'],
      roots: [0, 5],
      types: ['Maj7', 'Maj7']
    },
    ex_m7: {
      roman: ['ii m7', 'iii m7', 'vi m7'],
      roots: [2, 4, 9],
      types: ['m7', 'm7', 'm7']
    },
    ex_dom7: {
      roman: ['V7', 'I7'],
      roots: [7, 0],
      types: ['Dom7', 'Dom7']
    },
    pop: {
      roman: ['I', 'V', 'vi', 'IV'],
      roots: [0, 7, 9, 5],
      types: ['Major', 'Major', 'Minor', 'Major']
    },
    blues: {
      roman: ['I7', 'IV7', 'V7'],
      roots: [0, 5, 7],
      types: ['Dom7', 'Dom7', 'Dom7']
    },
    jazz: {
      roman: ['ii7', 'V7', 'Imaj7'],
      roots: [2, 7, 0],
      types: ['m7', 'Dom7', 'Maj7']
    }
  };

  const keySelect = document.getElementById('keySelect');
  const clefSelect = document.getElementById('clefSelect');
  const genreSelect = document.getElementById('genreSelect');
  const chordsPerPage = document.getElementById('chordsPerPage');
  const modeSelect = document.getElementById('modeSelect');
  const rhythmSelect = document.getElementById('rhythmSelect');
  const typeSelect = document.getElementById('typeSelect');
  const inversionSelect = document.getElementById('inversionSelect');
  const keyboardEl = document.getElementById('keyboard');
  const notationViewport = document.getElementById('notation-viewport');
  const notationError = document.getElementById('notationError');

  Object.keys(KEY_ROOTS).forEach(key => {
    if (!['C#', 'Ab'].includes(key)) {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = `${key} Key`;
      keySelect.appendChild(option);
    }
  });

  const midiToKeyElMap = {};

  for (let midi = 36; midi <= 84; midi++) {
    const noteName = DISPLAY_NAMES[midi % 12];
    const isBlack = noteName.includes('#');
    const keyEl = document.createElement('div');
    keyEl.className = `key ${isBlack ? 'black' : 'white'}`;
    keyEl.dataset.midi = midi;

    keyEl.addEventListener('mousedown', e => { e.preventDefault(); handleNoteOn(midi); });
    keyEl.addEventListener('mouseup', e => { e.preventDefault(); handleNoteOff(midi); });
    keyEl.addEventListener('mouseleave', e => { if (e.buttons) handleNoteOff(midi); });

    keyEl.addEventListener('touchstart', e => { e.preventDefault(); handleNoteOn(midi); }, { passive: false });
    keyEl.addEventListener('touchend', e => { e.preventDefault(); handleNoteOff(midi); }, { passive: false });
    keyEl.addEventListener('touchcancel', e => { e.preventDefault(); handleNoteOff(midi); }, { passive: false });

    keyboardEl.appendChild(keyEl);
    midiToKeyElMap[midi] = keyEl;
  }

  function getNoteFromMidi(midi) {
    const safeMidi = ((midi % 12) + 12) % 12;
    const name = DISPLAY_NAMES[safeMidi];
    const octave = Math.floor(midi / 12) - 1;
    return `${name}${octave}`;
  }

  function midiToVexKey(midi) {
    const safeMidi = ((midi % 12) + 12) % 12;
    const noteName = NOTE_NAMES[safeMidi];
    const octave = Math.floor(midi / 12) - 1;
    return `${noteName}/${octave}`;
  }

  function getRhythmInfo() {
    const rhythm = rhythmSelect.value;
    if (rhythm === 'w') return { duration: 'w', units: 1, beats: 4 };
    if (rhythm === 'h') return { duration: 'h', units: 2, beats: 2 };
    if (rhythm === '8') return { duration: '8', units: 8, beats: 0.5 };
    return { duration: 'q', units: 4, beats: 1 };
  }

  function getChordMidisForStep(stepIndex) {
    const key = keySelect.value;
    const clef = clefSelect.value;
    const genre = genreSelect.value;
    const mode = modeSelect.value;
    let inversion = parseInt(inversionSelect.value, 10) || 0;
    const baseOctave = clef === 'bass' ? 3 : 4;

    let rootMidi = 60;
    let offsets = [0, 4, 7];

    if (GENRE_PROGRESSIONS[genre] && GENRE_PROGRESSIONS[genre].customPatterns) {
      const prog = GENRE_PROGRESSIONS[genre];
      const step = stepIndex % prog.customPatterns.length;
      rootMidi = (baseOctave + 1) * 12 + KEY_ROOTS[key];
      offsets = prog.customPatterns[step];
    } else if (genre === 'ex_ninths') {
      const types = ['Dom9', 'Maj9', 'm9', 'Add9'];
      const randType = types[stepIndex % types.length];
      const randRoot = DIATONIC_SCALE_ROOTS[stepIndex % DIATONIC_SCALE_ROOTS.length];
      rootMidi = (baseOctave + 1) * 12 + ((KEY_ROOTS[key] + randRoot) % 12);
      offsets = CHORD_OFFSETS[randType];
    } else if (genre === 'ex_sixths') {
      const types = ['Maj6', 'm6'];
      const randType = types[stepIndex % types.length];
      const randRoot = DIATONIC_SCALE_ROOTS[stepIndex % DIATONIC_SCALE_ROOTS.length];
      rootMidi = (baseOctave + 1) * 12 + ((KEY_ROOTS[key] + randRoot) % 12);
      offsets = CHORD_OFFSETS[randType];
    } else if (genre === 'ex_all_chords') {
      const allTypes = Object.keys(CHORD_OFFSETS);
      const randType = allTypes[stepIndex % allTypes.length];
      const randRoot = DIATONIC_SCALE_ROOTS[stepIndex % DIATONIC_SCALE_ROOTS.length];
      rootMidi = (baseOctave + 1) * 12 + ((KEY_ROOTS[key] + randRoot) % 12);
      offsets = CHORD_OFFSETS[randType];
    } else if (genre !== 'custom' && GENRE_PROGRESSIONS[genre]) {
      const prog = GENRE_PROGRESSIONS[genre];
      const step = stepIndex % prog.roman.length;
      const keyRootSemitone = KEY_ROOTS[key];
      const offsetSemitone = prog.roots[step];
      rootMidi = (baseOctave + 1) * 12 + ((keyRootSemitone + offsetSemitone) % 12);
      offsets = CHORD_OFFSETS[prog.types[step]];
    } else {
      if (mode === 'single') {
        const randOffset = DIATONIC_SCALE_ROOTS[stepIndex % DIATONIC_SCALE_ROOTS.length];
        const midi = (baseOctave + 1) * 12 + ((KEY_ROOTS[key] + randOffset) % 12);
        return [midi + transposeSemitones];
      }
      const type = typeSelect.value;
      rootMidi = (baseOctave + 1) * 12 + KEY_ROOTS[key];
      offsets = CHORD_OFFSETS[type] || [0, 4, 7];
    }

    let chordMidis = offsets.map(offset => rootMidi + offset + transposeSemitones);

    if (chordMidis.length > 1) {
      inversion = inversion % chordMidis.length;
      for (let i = 0; i < inversion; i++) {
        chordMidis[i] += 12;
      }
      chordMidis.sort((a, b) => a - b);
    }

    return chordMidis;
  }

  function buildMeasureNotes(measureMidis, duration, units, mode) {
    const notes = [];
    if (mode === 'single') {
      const midi = measureMidis[0];
      for (let i = 0; i < units; i++) {
        notes.push(new VF.StaveNote({
          clef: clefSelect.value,
          keys: [midiToVexKey(midi)],
          duration: duration
        }));
      }
      return notes;
    }

    if (mode === 'chord') {
      for (let i = 0; i < units; i++) {
        notes.push(new VF.StaveNote({
          clef: clefSelect.value,
          keys: measureMidis.map(midiToVexKey),
          duration: duration
        }));
      }
      return notes;
    }

    if (mode === 'broken') {
      for (let i = 0; i < units; i++) {
        const midi = measureMidis[i % measureMidis.length];
        notes.push(new VF.StaveNote({
          clef: clefSelect.value,
          keys: [midiToVexKey(midi)],
          duration: duration
        }));
      }
      return notes;
    }

    if (mode === 'arpeggio') {
      for (let i = 0; i < units; i++) {
        const cycle = Math.floor(i / measureMidis.length);
        const index = i % measureMidis.length;
        const midi = measureMidis[index] + (cycle * 12);
        notes.push(new VF.StaveNote({
          clef: clefSelect.value,
          keys: [midiToVexKey(midi)],
          duration: duration
        }));
      }
      return notes;
    }

    return notes;
  }

  function addAccidentalsToNote(staveNote, vexKeys) {
    vexKeys.forEach((key, index) => {
      const pitch = key.split('/')[0];
      if (pitch.includes('#')) {
        staveNote.addModifier(new VF.Accidental('#'), index);
      } else if (pitch.includes('b')) {
        staveNote.addModifier(new VF.Accidental('b'), index);
      }
    });
  }

  function drawScore() {
    notationViewport.innerHTML = '';
    notationError.style.display = 'none';
    notationError.textContent = '';

    const countOnStaff = parseInt(chordsPerPage.value, 10) || 1;
    const rhythmInfo = getRhythmInfo();
    const minimumStaveWidth = 150;
    const viewportWidth = notationViewport.clientWidth || 800;
    const availableWidth = Math.max(viewportWidth - 20, 320);
    const staveWidth = Math.max(minimumStaveWidth, Math.floor(availableWidth / countOnStaff));
    const totalWidth = Math.max(320, staveWidth * countOnStaff);

    let renderer;
    try {
      renderer = new VF.Renderer(notationViewport, VF.Renderer.Backends.SVG);
      renderer.resize(totalWidth, 175);
    } catch (error) {
      showNotationError('Unable to create VexFlow renderer: ' + error.message);
      return;
    }

    const context = renderer.getContext();
    const key = keySelect.value;
    const clef = clefSelect.value;
    const genre = genreSelect.value;
    const mode = modeSelect.value;

    const progressionDisplay = document.getElementById('progressionDisplay');
    const nextBtn = document.getElementById('nextChordBtn');

    if (genre !== 'custom') {
      progressionDisplay.style.display = 'block';
      nextBtn.style.display = 'inline-block';

      const prog = GENRE_PROGRESSIONS[genre];
      let stepText = `Exercise Step ${currentProgressionStep + 1}`;
      if (prog && prog.roman && prog.roman.length) {
        const step = currentProgressionStep % prog.roman.length;
        stepText = `${prog.roman[step]} — Step ${currentProgressionStep + 1}`;
      }
      document.getElementById('romanText').textContent = `${stepText} — Showing ${countOnStaff} Measures`;
    } else {
      progressionDisplay.style.display = 'none';
      nextBtn.style.display = 'none';
    }

    targetMidiSet.clear();

    /* Render distinct upcoming measures across bars */
    for (let i = 0; i < countOnStaff; i++) {
      const stepForMeasure = currentProgressionStep + i;
      const xPos = i * staveWidth;
      const stave = new VF.Stave(xPos, 15, staveWidth - 5);

      if (i === 0) {
        stave.addClef(clef).addKeySignature(key);
      }

      stave.setContext(context).draw();

      const measureMidis = getChordMidisForStep(stepForMeasure);

      if (i === 0) {
        measureMidis.forEach(midi => targetMidiSet.add(midi));
        document.getElementById('targetNotes').textContent =
          Array.from(targetMidiSet).sort((a, b) => a - b).map(getNoteFromMidi).join(', ');
      }

      try {
        const measureNotes = buildMeasureNotes(measureMidis, rhythmInfo.duration, rhythmInfo.units, mode);
        const voice = new VF.Voice({ num_beats: 4, beat_value: 4 });
        voice.addTickables(measureNotes);

        measureNotes.forEach(note => {
          const keys = note.getKeys();
          addAccidentalsToNote(note, keys);

          if (i === 0) {
            keys.forEach((keyString, keyIndex) => {
              const midi = vexKeyToMidi(keyString);
              if (chordWasCompleted || activeMidiNotes.has(midi)) {
                note.setKeyStyle(keyIndex, {
                  fillStyle: '#10b981',
                  strokeStyle: '#10b981'
                });
              }
            });
          }
        });

        new VF.Formatter().joinVoices([voice]).format([voice], Math.max(60, staveWidth - 55));
        voice.draw(context, stave);
      } catch (error) {
        console.error('VexFlow measure error:', error);
        showNotationError(`Staff rendering error in measure ${i + 1}: ${error.message}`);
        continue;
      }
    }
  }

  function vexKeyToMidi(vexKey) {
    const parts = vexKey.split('/');
    if (parts.length !== 2) return null;
    let note = parts[0].toLowerCase();
    const octave = parseInt(parts[1], 10);
    const pitchMap = {
      c: 0, 'c#': 1, db: 1, d: 2, 'd#': 3, eb: 3, e: 4,
      f: 5, 'f#': 6, gb: 6, g: 7, 'g#': 8, ab: 8, a: 9,
      'a#': 10, bb: 10, b: 11
    };
    note = note.replace('♯', '#').replace('♭', 'b');
    if (pitchMap[note] === undefined) return null;
    return (octave + 1) * 12 + pitchMap[note];
  }

  function showNotationError(message) {
    notationError.textContent = message;
    notationError.style.display = 'block';
  }

  function handleNoteOn(midi) {
    if (activeMidiNotes.has(midi)) return;
    activeMidiNotes.add(midi);

    if (midiToKeyElMap[midi]) {
      midiToKeyElMap[midi].classList.add('active');
    }

    try {
      if (audioEnabled) {
        synth.triggerAttack(Tone.Frequency(midi, 'midi').toNote());
      }
    } catch (error) {
      console.warn('Audio error:', error);
    }

    updateFeedback();
  }

  function handleNoteOff(midi) {
    activeMidiNotes.delete(midi);

    if (midiToKeyElMap[midi]) {
      midiToKeyElMap[midi].classList.remove('active');
    }

    try {
      if (audioEnabled) {
        synth.triggerRelease(Tone.Frequency(midi, 'midi').toNote());
      }
    } catch (error) {
      console.warn('Audio release error:', error);
    }

    updateFeedback();
  }

  function updateFeedback() {
    document.getElementById('playedNotes').textContent =
      Array.from(activeMidiNotes).sort((a, b) => a - b).map(getNoteFromMidi).join(', ') || 'None';

    drawScore();
    evaluateMatch();
  }

  function evaluateMatch() {
    const statusEl = document.getElementById('matchStatus');

    if (activeMidiNotes.size === 0) {
      statusEl.textContent = 'Play target notes on your keyboard...';
      statusEl.className = '';
      return;
    }

    const active = Array.from(activeMidiNotes);
    const target = Array.from(targetMidiSet);
    const isMatch = target.length === active.length && target.every(midi => activeMidiNotes.has(midi));

    if (isMatch) {
      statusEl.textContent = '✓ Correct!';
      statusEl.className = 'correct';

      if (!hasEvaluatedCurrentChord) {
        hasEvaluatedCurrentChord = true;
        totalAttempts++;
        correctAttempts++;
        totalResponseTime += (Date.now() - chordStartTime) / 1000;
        updateStatsDisplay();
      }

      if (!window.__advanceScheduled) {
        window.__advanceScheduled = true;
        chordWasCompleted = true;
        drawScore();

        setTimeout(() => {
          window.__advanceScheduled = false;
          currentProgressionStep++;
          activeMidiNotes.clear();
          chordWasCompleted = false;
          hasEvaluatedCurrentChord = false;
          chordStartTime = Date.now();
          clearKeyboardHighlights();
          drawScore();
          document.getElementById('playedNotes').textContent = 'None';
        }, 500);
      }
      return;
    }

    const hasWrongNote = active.some(midi => !targetMidiSet.has(midi));
    if (hasWrongNote) {
      statusEl.textContent = '✕ Incorrect Note';
      statusEl.className = 'incorrect';

      if (!hasEvaluatedCurrentChord) {
        hasEvaluatedCurrentChord = true;
        totalAttempts++;
        updateStatsDisplay();
      }
    } else {
      statusEl.textContent = '… Incomplete Chord';
      statusEl.className = '';
    }
  }

  function clearKeyboardHighlights() {
    Object.values(midiToKeyElMap).forEach(keyEl => keyEl.classList.remove('active'));
  }

  function updateStatsDisplay() {
    document.getElementById('statAttempts').textContent = totalAttempts;
    const accuracy = totalAttempts > 0 ? Math.round((correctAttempts / totalAttempts) * 100) : 100;
    document.getElementById('statAccuracy').textContent = `${accuracy}%`;
    const average = correctAttempts > 0 ? (totalResponseTime / correctAttempts).toFixed(1) : '0.0';
    document.getElementById('statSpeed').textContent = `${average}s`;
  }

  document.getElementById('transUpBtn').addEventListener('click', () => {
    transposeSemitones++;
    updateTransposeDisplay();
    resetCurrentExercise();
  });

  document.getElementById('transDownBtn').addEventListener('click', () => {
    transposeSemitones--;
    updateTransposeDisplay();
    resetCurrentExercise();
  });

  function updateTransposeDisplay() {
    document.getElementById('transValDisplay').textContent =
      `${transposeSemitones > 0 ? '+' : ''}${transposeSemitones} ST`;
  }

  function resetCurrentExercise() {
    activeMidiNotes.clear();
    chordWasCompleted = false;
    clearKeyboardHighlights();
    currentProgressionStep = 0;
    hasEvaluatedCurrentChord = false;
    chordStartTime = Date.now();
    document.getElementById('matchStatus').textContent = 'Play target notes on your keyboard...';
    document.getElementById('matchStatus').className = '';
    drawScore();
  }

  document.getElementById('flowModeBtn').addEventListener('click', () => {
    isFlowModeActive = !isFlowModeActive;
    const btn = document.getElementById('flowModeBtn');

    if (isFlowModeActive) {
      btn.textContent = 'Flow Mode: ON 🌊';
      btn.style.background = '#059669';

      if (flowTimerInterval) clearInterval(flowTimerInterval);

      flowTimerInterval = setInterval(() => {
        currentProgressionStep++;
        activeMidiNotes.clear();
        clearKeyboardHighlights();
        hasEvaluatedCurrentChord = false;
        chordStartTime = Date.now();
        drawScore();
        updateFeedback();
      }, 3000);
    } else {
      btn.textContent = 'Flow Mode: OFF';
      btn.style.background = '#2563eb';
      if (flowTimerInterval) {
        clearInterval(flowTimerInterval);
        flowTimerInterval = null;
      }
    }
  });

  document.getElementById('toggleMetronomeBtn').addEventListener('click', async () => {
    try {
      await Tone.start();
      if (Tone.context.state !== 'running') await Tone.context.resume();

      const bpm = parseInt(document.getElementById('bpmInput').value, 10) || 100;
      Tone.Transport.bpm.value = bpm;

      if (!isMetronomeRunning) {
        metronomeEventId = Tone.Transport.scheduleRepeat(time => {
          clickSynth.triggerAttackRelease('C4', '8n', time);
        }, '4n');

        Tone.Transport.start();
        isMetronomeRunning = true;
        const btn = document.getElementById('toggleMetronomeBtn');
        btn.textContent = 'Stop Click';
        btn.style.background = '#dc2626';
      } else {
        Tone.Transport.stop();
        if (metronomeEventId !== null) {
          Tone.Transport.clear(metronomeEventId);
          metronomeEventId = null;
        }
        isMetronomeRunning = false;
        const btn = document.getElementById('toggleMetronomeBtn');
        btn.textContent = 'Start Click';
        btn.style.background = '#2563eb';
      }
    } catch (error) {
      console.error('Metronome error:', error);
    }
  });

  document.getElementById('bpmInput').addEventListener('change', event => {
    let bpm = parseInt(event.target.value, 10) || 100;
    bpm = Math.max(40, Math.min(240, bpm));
    event.target.value = bpm;
    Tone.Transport.bpm.value = bpm;
  });

  document.getElementById('nextChordBtn').addEventListener('click', () => {
    currentProgressionStep++;
    activeMidiNotes.clear();
    chordWasCompleted = false;
    clearKeyboardHighlights();
    hasEvaluatedCurrentChord = false;
    chordStartTime = Date.now();
    document.getElementById('matchStatus').textContent = 'Play target notes on your keyboard...';
    document.getElementById('matchStatus').className = '';
    drawScore();
  });

  async function setupMIDI() {
    const status = document.getElementById('midiStatus');
    if (!navigator.requestMIDIAccess) {
      status.textContent = 'Web MIDI unavailable in this browser';
      return;
    }

    try {
      const midiAccess = await navigator.requestMIDIAccess();
      let inputCount = 0;

      for (const input of midiAccess.inputs.values()) {
        inputCount++;
        input.onmidimessage = handleMIDIMessage;
      }

      status.textContent = inputCount > 0
        ? `Connected ✓ (${inputCount} input${inputCount === 1 ? '' : 's'})`
        : 'MIDI available — no keyboard detected';

      midiAccess.onstatechange = () => {
        let count = 0;
        for (const input of midiAccess.inputs.values()) {
          count++;
          input.onmidimessage = handleMIDIMessage;
        }
        status.textContent = count > 0
          ? `Connected ✓ (${count} input${count === 1 ? '' : 's'})`
          : 'MIDI available — no keyboard detected';
      };
    } catch (error) {
      console.error('MIDI access error:', error);
      status.textContent = 'MIDI access denied/unavailable';
    }
  }

  function handleMIDIMessage(event) {
    const data = event.data;
    if (!data || data.length < 2) return;

    const status = data[0];
    const note = data[1];
    const velocity = data[2] || 0;
    const command = status >> 4;

    if (command === 9 && velocity > 0) {
      handleNoteOn(note);
    } else if (command === 8 || (command === 9 && velocity === 0)) {
      handleNoteOff(note);
    }
  }

  document.getElementById('enableAudio').addEventListener('click', async () => {
    try {
      await Tone.start();
      if (Tone.context.state !== 'running') await Tone.context.resume();
      audioEnabled = true;
      const btn = document.getElementById('enableAudio');
      btn.textContent = 'Audio Active ✓';
      btn.style.background = '#059669';
    } catch (error) {
      console.error('Audio error:', error);
    }
  });

  [
    'keySelect', 'clefSelect', 'genreSelect', 'chordsPerPage',
    'modeSelect', 'rhythmSelect', 'typeSelect', 'inversionSelect'
  ].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      activeMidiNotes.clear();
      clearKeyboardHighlights();
      currentProgressionStep = 0;
      hasEvaluatedCurrentChord = false;
      chordStartTime = Date.now();
      document.getElementById('matchStatus').textContent = 'Play target notes on your keyboard...';
      document.getElementById('matchStatus').className = '';
      drawScore();
    });
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { drawScore(); }, 100);
  });

  window.addEventListener('beforeunload', () => {
    if (flowTimerInterval) clearInterval(flowTimerInterval);
    if (metronomeEventId !== null) Tone.Transport.clear(metronomeEventId);
  });

  window.addEventListener('load', async () => {
    drawScore();
    await setupMIDI();
  });

  drawScore();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Smart MIDI Piano Studio Pro</title>

  <!-- VexFlow 4.2.2 -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>

  <!-- Tone.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 16px;
      max-width: 1100px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    h2 {
      margin-top: 4px;
      margin-bottom: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    select,
    button,
    input {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      font-size: 13px;
      background: #334155;
      color: #fff;
      cursor: pointer;
      outline: none;
      width: 100%;
    }

    button {
      background: #2563eb;
      border: none;
      font-weight: 600;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .feature-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .feature-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feature-group input[type="number"] {
      width: 65px;
      text-align: center;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-top: 14px;
      font-size: 13px;
    }

    .stat-val {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
    }

    /*
      IMPORTANT:
      The viewport itself scrolls horizontally.
      This allows 8 or 10 measures to remain readable instead
      of squeezing each stave down to an unusable width.
    */
    #notation-viewport {
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;
      width: 100%;
      min-height: 180px;
      display: block;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      text-align: left;
    }

    #notation-viewport svg {
      display: block;
      min-width: 320px;
    }

    .feedback-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
    }

    #matchStatus {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #94a3b8;
    }

    #matchStatus.correct {
      color: #10b981;
    }

    #matchStatus.incorrect {
      color: #ef4444;
    }

    .status-text {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .progression-banner {
      margin-top: 10px;
      padding: 8px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
    }

    .error-banner {
      background: #450a0a;
      color: #fecaca;
      border: 1px solid #7f1d1d;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 12px;
      display: none;
      text-align: left;
    }

    .piano-container {
      display: flex;
      justify-content: center;
      margin-top: 14px;
      position: relative;
      user-select: none;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }

    .key {
      display: inline-block;
      position: relative;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: none;
    }

    .key.white {
      width: 32px;
      height: 100px;
      background: #fff;
      border: 1px solid #cbd5e1;
      z-index: 1;
    }

    .key.black {
      width: 20px;
      height: 60px;
      background: #1e293b;
      margin-left: -10px;
      margin-right: -10px;
      z-index: 2;
    }

    .key.active {
      background: #3b82f6 !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 6px;
      }

      .card {
        padding: 10px;
      }

      .key.white {
        width: 28px;
      }

      .key.black {
        width: 18px;
        margin-left: -9px;
        margin-right: -9px;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Smart MIDI Piano Studio Pro</h2>

  <div class="controls">

    <select id="keySelect"></select>

    <select id="clefSelect">

      <option value="ex_sixths">★ 6th Chords Mix</option>
      <option value="ex_aug_dim">★ Aug & Dim Triads Mix</option>
      <option value="ex_all_triads">★ ALL Triads Mix</option>
      <option value="ex_all_sevenths">★ ALL 7th Chords Mix</option>
      <option value="ex_shells">★ Jazz Shell Voicings Mix</option>
      <option value="ex_triads_power">★ Triads + Power Chords Mix</option>

      <option value="ex_inversions">Random Inversions</option>

      <option value="ex_minor">Exercise: All Minor Chords</option>

    <select id="chordsPerPage">

    </select>

    <select id="rhythmSelect">

      <option value="h">Half Notes (1/2)</option>
      <option value="q" selected>Quarter Notes (1/4)</option>
      <option value="8">Eighth Notes (1/8)</option>
    </select>

    <select id="typeSelect">
      <option value="Major">Major Triad</option>
      <option value="Minor">Minor Triad</option>
      <option value="Aug">Augmented</option>
      <option value="Dim">Diminished</option>
      <option value="Sus2">Sus2</option>
      <option value="Sus4">Sus4</option>
      <option value="Maj6">Major 6th</option>
      <option value="m6">Minor 6th</option>
      <option value="Dom7">Dominant 7th</option>
      <option value="Maj7">Major 7th</option>
      <option value="m7">Minor 7th</option>
      <option value="m7b5">Half-Diminished 7th</option>
      <option value="dim7">Fully-Diminished 7th</option>
      <option value="Dom9">Dominant 9th</option>
      <option value="Maj9">Major 9th</option>
      <option value="m9">Minor 9th</option>
      <option value="Add9">Add 9</option>
      <option value="Shell3">Shell Root-3rd-7th</option>
      <option value="Shell7">Shell Root-7th-3rd</option>
      <option value="Power">Power Chord</option>
      <option value="PowerOct">Power Chord + Octave</option>
    </select>

    <select id="inversionSelect">
      <option value="0">Root Position</option>
      <option value="1">1st Inversion</option>
      <option value="2">2nd Inversion</option>
      <option value="3">3rd Inversion</option>
      <option value="4">4th Inversion</option>
    </select>

    <button id="nextChordBtn" style="display:none;">
      Next Measure ➔
    </button>

    <button id="enableAudio">
      Enable Sound
    </button>

  </div>

  <div class="feature-bar">

    <div class="feature-group">
      <span>🥁 Metronome:</span>

      <button id="toggleMetronomeBtn">
        Start Click
      </button>

      <input
        type="number"
        id="bpmInput"
        value="100"
        min="40"
        max="240">

      <span>BPM</span>
    </div>

    <div class="feature-group">

      <span>🔄 Transpose:</span>

      <button id="transDownBtn">-1</button>

      <span
        id="transValDisplay"
        style="font-weight:bold;color:#38bdf8;">
        0 ST
      </span>

      <button id="transUpBtn">+1</button>

    </div>

    <div class="feature-group">

      <button id="flowModeBtn">
        Flow Mode: OFF
      </button>

    </div>

  </div>

  <div
    id="progressionDisplay"
    class="progression-banner"
    style="display:none;">

    Analysis:
    <span id="romanText">-</span>

  </div>

  <div id="notation-viewport"></div>

  <div id="notationError" class="error-banner"></div>

  <div class="stats-bar">

    <div>
      Attempts:
      <div class="stat-val" id="statAttempts">0</div>
    </div>

    <div>
      Accuracy:
      <div class="stat-val" id="statAccuracy">100%</div>
    </div>

    <div>
      Avg Speed:
      <div class="stat-val" id="statSpeed">0.0s</div>
    </div>

  </div>

  <div class="feedback-box">

    <div id="matchStatus">
      Play target notes on your keyboard...
    </div>

    <div class="status-text">
      Target Notes:
      <span id="targetNotes" style="color:#60a5fa;">
        -
      </span>
      |
      Active Played:
      <span id="playedNotes" style="color:#f59e0b;">
        None
      </span>
    </div>

    <div
      class="status-text"
      style="margin-top:4px;">

      MIDI Connection:
      <span id="midiStatus">
        Checking...
      </span>

    </div>

  </div>

  <div
    class="piano-container"
    id="keyboard">
  </div>

</div>

<script>

  /*
   * ============================================================
   * VEXFLOW
   * ============================================================
   */

  const VF = Vex.Flow;

  /*
   * ============================================================
   * AUDIO
   * ============================================================
   */

  const synth = new Tone.PolySynth().toDestination();
  const clickSynth = new Tone.MembraneSynth().toDestination();

  let audioEnabled = false;

  /*
   * ============================================================
   * METRONOME
   * ============================================================
   */

  let isMetronomeRunning = false;
  let metronomeEventId = null;

  /*
   * ============================================================
   * EXERCISE STATE
   * ============================================================
   */

  let totalAttempts = 0;
  let correctAttempts = 0;

  let chordStartTime = Date.now();
  let totalResponseTime = 0;

  /*
   * This is deliberately NOT reset every time drawScore()
   * runs. That was one of the bugs in the original version.
   */
  let hasEvaluatedCurrentChord = false;

  let transposeSemitones = 0;

  let isFlowModeActive = false;
  let flowTimerInterval = null;

  let activeMidiNotes = new Set();
  let targetMidiSet = new Set();

  // True while the current target chord is being shown green
  // before it is replaced by the next chord.
  let chordWasCompleted = false;

  let currentProgressionStep = 0;

  /*
   * ============================================================
   * NOTE DATA
   * ============================================================
   */

  const NOTE_NAMES = [
    'c',
    'c#',
    'd',
    'd#',
    'e',
    'f',
    'f#',
    'g',
    'g#',
    'a',

    'b'
  ];

  const DISPLAY_NAMES = [
    'C',
    'C#',
    'D',
    'D#',
    'E',
    'F',
    'F#',
    'G',
    'G#',
    'A',
    'A#',
    'B'

  const CHORD_OFFSETS = {

    Major: [0, 4, 7],

    Minor: [0, 3, 7],

    Aug: [0, 4, 8],

    Dim: [0, 3, 6],

    Sus2: [0, 2, 7],

    Sus4: [0, 5, 7],

    Maj6: [0, 4, 7, 9],

    m6: [0, 3, 7, 9],

    Dom7: [0, 4, 7, 10],

    Maj7: [0, 4, 7, 11],

    m7: [0, 3, 7, 10],

    m7b5: [0, 3, 6, 10],

    dim7: [0, 3, 6, 9],

    Dom9: [0, 4, 7, 10, 14],

    Maj9: [0, 4, 7, 11, 14],

    m9: [0, 3, 7, 10, 14],

    Add9: [0, 4, 7, 14],

    Shell3: [0, 4, 10],

    Shell7: [0, 10, 16],

    Power: [0, 7],

    PowerOct: [0, 7, 12]

  };

  const KEY_ROOTS = {

    C: 0,
    'C#': 1,
    Db: 1,
    D: 2,
    Eb: 3,
    E: 4,
    F: 5,
    'F#': 6,
    G: 7,
    Ab: 8,
    A: 9,
    Bb: 10,
    B: 11

  };

  const DIATONIC_SCALE_ROOTS = [
    0,
    2,
    4,
    5,
    7,
    9,
    11
  ];

  /*
   * ============================================================
   * PROGRESSIONS
   * ============================================================
   */

  const GENRE_PROGRESSIONS = {

    diatonic: {
      roman: [
        'I (Tonic)',
        'IV (Subdominant)',
        'V (Dominant)'
      ],
      roots: [0, 5, 7],
      types: [
        'Major',

        'Major'
      ]
    },

    ex_boogie: {
      roman: [
        'I Boogie',
        'IV Boogie',
        'V Boogie'
      ],
      customPatterns: [
        [0, 7, 9, 7],

        [7, 14, 16, 14]

    },

    ex_walking: {

    },

    ex_blues_licks: {
      roman: [
        'Minor Blues Lick',

      ],
      customPatterns: [
        [0, 3, 5],

        [12, 10, 7]
      ]
    },

    ex_ninths: {
      roman: [
        'Imaj9',
        'IVmaj9',
        'V9',
        'iim9'
      ],
      roots: [0, 5, 7, 2],
      types: [
        'Maj9',
        'Maj9',
        'Dom9',
        'm9'
      ]
    },

    ex_sixths: {
      roman: [
        'I6',
        'IV6',
        'iv6',
        'V6'
      ],
      roots: [0, 5, 5, 7],
      types: [
        'Maj6',
        'Maj6',
        'm6',
        'Maj6'
      ]
    },

    ex_aug_dim: {
      roman: [
        'I Aug',
        'vii Dim',
        'IV Aug',
        'vii Dim7'
      ],
      roots: [0, 11, 5, 11],
      types: [
        'Aug',
        'Dim',
        'Aug',
        'dim7'
      ]
    },

    ex_shells: {
      roman: [
        'ii7 Shell',

      ],

      ]
    },

    ex_inversions: {
      roman: [
        'I',
        'ii',
        'iii',

        'vii°'
      ],
      roots: [
        0,
        2,
        4,
        5,
        7,
        9,
        11
      ],
      types: [
        'Major',
        'Minor',
        'Minor',
        'Major',
        'Major',

    },

    ex_sus: {
      roman: [
        'I Sus2',

      ],

    ex_minor: {

    ex_dim: {

    ex_aug: {

    ex_power: {

    ex_maj7: {

    ex_m7: {

    },

    ex_dom7: {

    },

    pop: {
      roman: [
        'I',
        'V',
        'vi',
        'IV'
      ],
      roots: [
        0,
        7,
        9,
        5
      ],
      types: [
        'Major',
        'Major',
        'Minor',
        'Major'
      ]
    },

    blues: {
      roman: [
        'I7',
        'IV7',
        'V7'
      ],
      roots: [
        0,
        5,
        7
      ],
      types: [
        'Dom7',
        'Dom7',
        'Dom7'
      ]
    },

    jazz: {
      roman: [
        'ii7',
        'V7',
        'Imaj7'
      ],
      roots: [
        2,
        7,
        0
      ],
      types: [
        'm7',
        'Dom7',
        'Maj7'
      ]
    }

  };

  /*
   * ============================================================
   * DOM ELEMENTS
   * ============================================================
   */

  const keySelect =
    document.getElementById('keySelect');

  const clefSelect =
    document.getElementById('clefSelect');

  const genreSelect =
    document.getElementById('genreSelect');

  const chordsPerPage =
    document.getElementById('chordsPerPage');

  const modeSelect =
    document.getElementById('modeSelect');

  const rhythmSelect =
    document.getElementById('rhythmSelect');

  const typeSelect =
    document.getElementById('typeSelect');

  const inversionSelect =
    document.getElementById('inversionSelect');

  const keyboardEl =
    document.getElementById('keyboard');

  const notationViewport =
    document.getElementById('notation-viewport');

  const notationError =
    document.getElementById('notationError');

  /*
   * ============================================================
   * KEY SELECT
   * ============================================================
   */

  Object.keys(KEY_ROOTS).forEach(key => {

    if (!['C#', 'Ab'].includes(key)) {

      const option =
        document.createElement('option');

      option.value = key;
      option.textContent = `${key} Key`;

      keySelect.appendChild(option);
    }

  });

  /*
   * ============================================================
   * PIANO
   *
   * Expanded from C3-C5 to C2-C6 so transposition doesn't
   * immediately make exercises impossible to play.
   * ============================================================
   */

  const midiToKeyElMap = {};

  for (let midi = 36; midi <= 84; midi++) {

    const noteName =
      DISPLAY_NAMES[midi % 12];

    const isBlack =
      noteName.includes('#');

    const keyEl =
      document.createElement('div');

    keyEl.className =
      `key ${isBlack ? 'black' : 'white'}`;

    keyEl.dataset.midi = midi;

    /*
     * Mouse
     */

    keyEl.addEventListener('mousedown', e => {
      e.preventDefault();
      handleNoteOn(midi);
    });

    keyEl.addEventListener('mouseup', e => {
      e.preventDefault();
      handleNoteOff(midi);
    });

    keyEl.addEventListener('mouseleave', e => {
      if (e.buttons) {
        handleNoteOff(midi);
      }
    });

    /*
     * Touch
     */

    keyEl.addEventListener('touchstart', e => {
      e.preventDefault();
      handleNoteOn(midi);
    }, { passive: false });

    keyEl.addEventListener('touchend', e => {
      e.preventDefault();
      handleNoteOff(midi);
    }, { passive: false });

    keyEl.addEventListener('touchcancel', e => {
      e.preventDefault();
      handleNoteOff(midi);
    }, { passive: false });

    keyboardEl.appendChild(keyEl);

    midiToKeyElMap[midi] = keyEl;
  }

  /*
   * ============================================================
   * MIDI -> NOTE NAME
   * ============================================================
   */

  function getNoteFromMidi(midi) {

    const safeMidi =
      ((midi % 12) + 12) % 12;

    const name =
      DISPLAY_NAMES[safeMidi];

    const octave =
      Math.floor(midi / 12) - 1;

    return `${name}${octave}`;
  }

  /*
   * ============================================================
   * MIDI -> VEXFLOW KEY
   * ============================================================
   */

  function midiToVexKey(midi) {

    const safeMidi =
      ((midi % 12) + 12) % 12;

    const noteName =
      NOTE_NAMES[safeMidi];

    const octave =
      Math.floor(midi / 12) - 1;

    return `${noteName}/${octave}`;
  }

  /*
   * ============================================================
   * RHYTHM INFORMATION
   *
   * THIS IS THE IMPORTANT STAFF FIX.
   *
   * VexFlow voices need to contain exactly the amount of
   * rhythmic material specified by the time signature.
   *
   * 4/4 therefore means:
   *
   * Whole    = 1 note
   * Half     = 2 notes
   * Quarter  = 4 notes
   * Eighth   = 8 notes
   * ============================================================
   */

  function getRhythmInfo() {

    const rhythm =
      rhythmSelect.value;

    if (rhythm === 'w') {
      return {
        duration: 'w',
        units: 1,
        beats: 4
      };
    }

    if (rhythm === 'h') {
      return {
        duration: 'h',
        units: 2,
        beats: 2
      };
    }

    if (rhythm === '8') {
      return {
        duration: '8',
        units: 8,
        beats: 0.5
      };
    }

    return {
      duration: 'q',
      units: 4,
      beats: 1
    };
  }

  /*
   * ============================================================
   * GET CHORD FOR EXERCISE STEP
   * ============================================================
   */

  function getChordMidisForStep(stepIndex) {

    const key =
      keySelect.value;

    const clef =
      clefSelect.value;

    const genre =
      genreSelect.value;

    const mode =
      modeSelect.value;

    let inversion =
      parseInt(inversionSelect.value, 10) || 0;

    const baseOctave =
      clef === 'bass' ? 3 : 4;

    let rootMidi = 60;

    let offsets = [0, 4, 7];

    /*
     * Custom pattern exercises
     */

    if (
      GENRE_PROGRESSIONS[genre] &&
      GENRE_PROGRESSIONS[genre].customPatterns
    ) {

      const prog =
        GENRE_PROGRESSIONS[genre];

      const step =
        stepIndex % prog.customPatterns.length;

      const keyRootSemitone =
        KEY_ROOTS[key];

      rootMidi =
        (baseOctave + 1) * 12 +
        keyRootSemitone;

      offsets =
        prog.customPatterns[step];

    }

    /*
     * Ninth exercises
     */

    else if (genre === 'ex_ninths') {

      const types = [
        'Dom9',
        'Maj9',
        'm9',
        'Add9'
      ];

      const randType =
        types[
          stepIndex % types.length
        ];

      const randRoot =
        DIATONIC_SCALE_ROOTS[
          stepIndex % DIATONIC_SCALE_ROOTS.length
        ];

      rootMidi =
        (baseOctave + 1) * 12 +
        (
          (KEY_ROOTS[key] + randRoot) % 12
        );

      offsets =
        CHORD_OFFSETS[randType];

    }

    /*
     * Sixth exercises
     */

    else if (genre === 'ex_sixths') {

      const types = [
        'Maj6',
        'm6'
      ];

      const randType =
        types[
          stepIndex % types.length
        ];

      const randRoot =
        DIATONIC_SCALE_ROOTS[
          stepIndex % DIATONIC_SCALE_ROOTS.length
        ];

      rootMidi =
        (baseOctave + 1) * 12 +
        (
          (KEY_ROOTS[key] + randRoot) % 12
        );

      offsets =
        CHORD_OFFSETS[randType];

    }

    /*
     * Ultimate mix
     */

    else if (genre === 'ex_all_chords') {

      const allTypes =
        Object.keys(CHORD_OFFSETS);

      const randType =
        allTypes[
          stepIndex % allTypes.length
        ];

      const randRoot =
        DIATONIC_SCALE_ROOTS[
          stepIndex % DIATONIC_SCALE_ROOTS.length
        ];

      rootMidi =
        (baseOctave + 1) * 12 +
        (
          (KEY_ROOTS[key] + randRoot) % 12
        );

      offsets =
        CHORD_OFFSETS[randType];

    }

    /*
     * Normal progression
     */

    else if (
      genre !== 'custom' &&
      GENRE_PROGRESSIONS[genre]
    ) {

      const prog =
        GENRE_PROGRESSIONS[genre];

      const step =
        stepIndex % prog.roman.length;

      const keyRootSemitone =
        KEY_ROOTS[key];

      const offsetSemitone =
        prog.roots[step];

      rootMidi =
        (baseOctave + 1) * 12 +
        (
          (keyRootSemitone + offsetSemitone) % 12
        );

      offsets =
        CHORD_OFFSETS[
          prog.types[step]
        ];

    }

    /*
     * Custom mode
     */

    else {

      if (mode === 'single') {

        const keySemis =
          KEY_ROOTS[key];

        const randOffset =
          DIATONIC_SCALE_ROOTS[
            stepIndex %
            DIATONIC_SCALE_ROOTS.length
          ];

        const midi =
          (baseOctave + 1) * 12 +
          (
            (keySemis + randOffset) % 12
          );

        return [
          midi + transposeSemitones
        ];

      }

      const type =
        typeSelect.value;

      const keySemis =
        KEY_ROOTS[key];

      rootMidi =
        (baseOctave + 1) * 12 +
        keySemis;

      offsets =
        CHORD_OFFSETS[type] ||
        [0, 4, 7];

    }

    /*
     * Build chord.
     */

    let chordMidis =
      offsets.map(offset =>
        rootMidi +
        offset +
        transposeSemitones
      );

    /*
     * Apply inversion.
     *
     * We cycle only as many inversions as there are notes.
     */

    if (chordMidis.length > 1) {

      inversion =
        inversion %
        chordMidis.length;

      for (
        let i = 0;
        i < inversion;
        i++
      ) {

        chordMidis[i] += 12;
      }

      chordMidis.sort(
        (a, b) => a - b
      );
    }

    return chordMidis;
  }

  /*
   * ============================================================
   * BUILD NOTES FOR A MEASURE
   *
   * This is where rhythm and playing mode are converted into
   * actual VexFlow notes.
   * ============================================================
   */

  function buildMeasureNotes(
    measureMidis,
    duration,
    units,
    mode
  ) {

    const notes = [];

    /*
     * Single note
     */

    if (mode === 'single') {

      const midi =
        measureMidis[0];

      for (let i = 0; i < units; i++) {

        notes.push(
          new VF.StaveNote({
            clef: clefSelect.value,
            keys: [
              midiToVexKey(midi)
            ],
            duration: duration
          })
        );
      }

      return notes;
    }

    /*
     * Block chord
     *
     * The same chord is repeated for each rhythmic unit.
     */

    if (mode === 'chord') {

      for (let i = 0; i < units; i++) {

        notes.push(
          new VF.StaveNote({
            clef: clefSelect.value,
            keys: measureMidis.map(
              midiToVexKey
            ),
            duration: duration
          })
        );
      }

      return notes;
    }

    /*
     * Broken chord
     *
     * One chord tone per rhythmic unit.
     * If there are fewer chord tones than units,
     * cycle through the chord.
     */

    if (mode === 'broken') {

      for (let i = 0; i < units; i++) {

        const midi =
          measureMidis[
            i % measureMidis.length
          ];

        notes.push(
          new VF.StaveNote({
            clef: clefSelect.value,
            keys: [
              midiToVexKey(midi)
            ],
            duration: duration
          })
        );
      }

      return notes;
    }

    /*
     * Arpeggio
     *
     * Same idea as broken chord, but always moves upward
     * through the chord and then wraps around.
     */

    if (mode === 'arpeggio') {

      for (let i = 0; i < units; i++) {

        const cycle =
          Math.floor(
            i / measureMidis.length
          );

        const index =
          i % measureMidis.length;

        const midi =
          measureMidis[index] +
          cycle * 12;

        notes.push(
          new VF.StaveNote({
            clef: clefSelect.value,
            keys: [
              midiToVexKey(midi)
            ],
            duration: duration
          })
        );
      }

      return notes;
    }

    return notes;
  }

  /*
   * ============================================================
   * ACCIDENTALS
   * ============================================================
   */

  function addAccidentalsToNote(
    staveNote,
    vexKeys
  ) {

    vexKeys.forEach(
      (key, index) => {

        const pitch =
          key.split('/')[0];

        if (pitch.includes('#')) {

          staveNote.addModifier(
            new VF.Accidental('#'),
            index
          );

        } else if (
          pitch.includes('b')
        ) {

          staveNote.addModifier(
            new VF.Accidental('b'),
            index
          );
        }

      }
    );
  }

  /*
   * ============================================================
   * HIGHLIGHT ACTIVE NOTES
   * ============================================================
   */

  function applyActiveNoteStyles(
    staveNote,
    measureMidis,
    isTargetMeasure
  ) {

    if (!isTargetMeasure) {
      return;
    }

    measureMidis.forEach(
      (midi, index) => {

        if (
          activeMidiNotes.has(midi)
        ) {

          staveNote.setKeyStyle(
            index,
            {
              fillStyle: '#10b981',
              strokeStyle: '#10b981'
            }
          );

        }

      }
    );
  }

  /*
   * ============================================================
   * DRAW SCORE
   * ============================================================
   */

  function drawScore() {

    /*
     * Remove previous SVG.
     */

    notationViewport.innerHTML = '';

    notationError.style.display =
      'none';

    notationError.textContent = '';

    const countOnStaff =
      parseInt(
        chordsPerPage.value,
        10
      ) || 1;

    const rhythmInfo =
      getRhythmInfo();

    /*
     * Minimum useful width per measure.
     *
     * This prevents 8 or 10 measures from becoming tiny.
     */

    const minimumStaveWidth = 150;

    const viewportWidth =
      notationViewport.clientWidth ||
      800;

    const availableWidth =
      Math.max(
        viewportWidth - 20,
        320
      );

    const staveWidth =
      Math.max(
        minimumStaveWidth,
        Math.floor(
          availableWidth /
          countOnStaff
        )
      );

    const totalWidth =
      Math.max(
        320,
        staveWidth * countOnStaff
      );

    /*
     * Renderer.
     */

    let renderer;

    try {

      renderer =
        new VF.Renderer(
          notationViewport,
          VF.Renderer.Backends.SVG
        );

      renderer.resize(
        totalWidth,
        175
      );

    } catch (error) {

      showNotationError(
        'Unable to create the VexFlow renderer: ' +
        error.message
      );

      return;
    }

    const context =
      renderer.getContext();

    const key =
      keySelect.value;

    const clef =
      clefSelect.value;

    const genre =
      genreSelect.value;

    const mode =
      modeSelect.value;

    /*
     * Progression UI
     */

    const progressionDisplay =
      document.getElementById(
        'progressionDisplay'
      );

    const nextBtn =
      document.getElementById(
        'nextChordBtn'
      );

    if (genre !== 'custom') {

      progressionDisplay.style.display =
        'block';

      nextBtn.style.display =
        'inline-block';

      const prog =
        GENRE_PROGRESSIONS[genre];

      let stepText =
        `Exercise Step ${
          currentProgressionStep + 1
        }`;

      if (
        prog &&
        prog.roman &&
        prog.roman.length
      ) {

        const step =
          currentProgressionStep %
          prog.roman.length;

        stepText =
          `${prog.roman[step]} — Step ${
            currentProgressionStep + 1
          }`;
      }

      document.getElementById(
        'romanText'
      ).textContent =
        `${stepText} — Showing ${countOnStaff} Measures`;

    } else {

      progressionDisplay.style.display =
        'none';

      nextBtn.style.display =
        'none';
    }

    /*
     * Target notes are ONLY the first measure.
     *
     * This is the measure the student is currently answering.
     */

    targetMidiSet.clear();

    const firstMeasureMidis =
      getChordMidisForStep(
        currentProgressionStep
      );

    firstMeasureMidis.forEach(
      midi =>
        targetMidiSet.add(midi)
    );

    document.getElementById(
      'targetNotes'
    ).textContent =
      Array.from(targetMidiSet)
        .sort((a, b) => a - b)
        .map(getNoteFromMidi)
        .join(', ');

    /*
     * Draw every measure.
     */

    for (
      let i = 0;
      i < countOnStaff;
      i++
    ) {

      const stepForMeasure =
        currentProgressionStep + i;

      const xPos =
        i * staveWidth;

      const stave =
        new VF.Stave(
          xPos,
          15,
          staveWidth - 5
        );

      /*
       * Clef and key signature only need to be placed
       * at the beginning of the displayed system.
       */

      if (i === 0) {

        stave
          .addClef(clef)
          .addKeySignature(key);

      }

      stave
        .setContext(context)
        .draw();

      /*
       * The first bar is the active target.
       * Other bars are deliberately blank.  Previously drawScore()
       * generated currentProgressionStep + i for every bar, which
       * made the progression appear to be copied across multiple
       * measures.
       */
      const isTargetMeasure = (i === 0);

      const measureMidis =
        isTargetMeasure
          ? getChordMidisForStep(
              currentProgressionStep
            )
          : [];

      /*
       * Build correctly filled measure.
       */

      let measureNotes;

      try {

        if (!isTargetMeasure) {
          /*
           * Fill non-target measures with rests so VexFlow still
           * receives a complete 4/4 voice without drawing another
           * chord.
           */
          measureNotes = [];

          for (let r = 0; r < rhythmInfo.units; r++) {
            measureNotes.push(
              new VF.GhostNote({
                duration: rhythmInfo.duration
              })
            );
          }
        } else {
          measureNotes =
            buildMeasureNotes(
              measureMidis,
              rhythmInfo.duration,
              rhythmInfo.units,
              mode
            );
        }

        /*
         * Safety check.
         *
         * A 4/4 voice must have exactly 4 beats.
         */

        const voice =
          new VF.Voice({
            num_beats: 4,
            beat_value: 4
          });

        voice.addTickables(
          measureNotes
        );

        /*
         * Accidentals and highlighting.
         */

        measureNotes.forEach(
          note => {

            const keys =
              note.getKeys();

            addAccidentalsToNote(
              note,
              keys
            );

            /*
             * Highlight the actual target notes.
             */

            if (i === 0) {

              keys.forEach(
                (keyString, keyIndex) => {

                  const midi =
                    vexKeyToMidi(
                      keyString
                    );

                  /*
                   * While the chord is being acknowledged, colour
                   * the complete target chord green. Otherwise only
                   * currently held MIDI notes are highlighted.
                   */
                  if (
                    chordWasCompleted ||
                    activeMidiNotes.has(midi)
                  ) {

                    note.setKeyStyle(
                      keyIndex,
                      {
                        fillStyle: '#10b981',
                        strokeStyle: '#10b981'
                      }
                    );
                  }

                }
              );
            }

          }
        );

        /*
         * Format.
         *
         * This is important: the voice is now properly filled
         * before Formatter is called.
         */

        new VF.Formatter()
          .joinVoices([voice])
          .format(
            [voice],
            Math.max(
              60,
              staveWidth - 55
            )
          );

        voice.draw(
          context,
          stave
        );

      } catch (error) {

        console.error(
          'VexFlow measure error:',
          error
        );

        showNotationError(
          `Staff rendering error in measure ${
            i + 1
          }: ${error.message}`
        );

        /*
         * Don't stop drawing the remaining measures.
         */

        continue;
      }
    }

    /*
     * DO NOT reset chordStartTime here.
     *
     * The old code did that every time a key was played,
     * which made response times inaccurate.
     */

  }

  /*
   * ============================================================
   * VEX KEY -> MIDI
   * ============================================================
   */

  function vexKeyToMidi(vexKey) {

    const parts =
      vexKey.split('/');

    if (parts.length !== 2) {
      return null;
    }

    let note =
      parts[0].toLowerCase();

    const octave =
      parseInt(parts[1], 10);

    const pitchMap = {

      c: 0,
      'c#': 1,
      db: 1,

      d: 2,
      'd#': 3,
      eb: 3,

      e: 4,

      f: 5,
      'f#': 6,
      gb: 6,

      g: 7,
      'g#': 8,
      ab: 8,

      a: 9,
      'a#': 10,
      bb: 10,

      b: 11

    };

    /*
     * VexFlow key names may theoretically contain
     * accidental symbols.
     */

    note =
      note
        .replace('♯', '#')
        .replace('♭', 'b');

    if (
      pitchMap[note] === undefined
    ) {

      return null;
    }

    return (
      (octave + 1) * 12 +
      pitchMap[note]
    );
  }

  /*
   * ============================================================
   * ERROR DISPLAY
   * ============================================================
   */

  function showNotationError(
    message
  ) {

    notationError.textContent =
      message;

    notationError.style.display =
      'block';
  }

  /*
   * ============================================================
   * NOTE ON
   * ============================================================
   */

  function handleNoteOn(midi) {

    /*
     * Prevent duplicate note-on events.
     */

    if (
      activeMidiNotes.has(midi)
    ) {
      return;
    }

    activeMidiNotes.add(midi);

    if (
      midiToKeyElMap[midi]
    ) {

      midiToKeyElMap[midi]
        .classList.add('active');
    }

    /*
     * Audio is allowed after Tone.start().
     */

    try {

      if (audioEnabled) {

        synth.triggerAttack(
          Tone.Frequency(
            midi,
            'midi'
          ).toNote()
        );

      }

    } catch (error) {

      console.warn(
        'Audio error:',
        error
      );
    }

    updateFeedback();
  }

  /*
   * ============================================================
   * NOTE OFF
   * ============================================================
   */

  function handleNoteOff(midi) {

    activeMidiNotes.delete(midi);

    if (
      midiToKeyElMap[midi]
    ) {

      midiToKeyElMap[midi]
        .classList.remove('active');
    }

    try {

      if (audioEnabled) {

        synth.triggerRelease(
          Tone.Frequency(
            midi,
            'midi'
          ).toNote()
        );

      }

    } catch (error) {

      console.warn(
        'Audio release error:',
        error
      );
    }

    updateFeedback();
  }

  /*
   * ============================================================
   * FEEDBACK
   * ============================================================
   */

  function updateFeedback() {

    document.getElementById(
      'playedNotes'
    ).textContent =
      Array.from(activeMidiNotes)
        .sort((a, b) => a - b)
        .map(getNoteFromMidi)
        .join(', ') ||
      'None';

    /*
     * Redraw so active target notes turn green.
     */

    drawScore();

    evaluateMatch();
  }

  /*
   * ============================================================
   * MATCH EVALUATION
   * ============================================================
   */

  function evaluateMatch() {

    const statusEl =
      document.getElementById(
        'matchStatus'
      );

    /*
     * Nothing being played.
     */

    if (
      activeMidiNotes.size === 0
    ) {

      statusEl.textContent =
        'Play target notes on your keyboard...';

      statusEl.className = '';

      return;
    }

    const active =
      Array.from(activeMidiNotes);

    const target =
      Array.from(targetMidiSet);

    /*
     * Exact set comparison.
     */

    const isMatch =
      target.length === active.length &&
      target.every(
        midi =>
          activeMidiNotes.has(midi)
      );

    /*
     * Correct.
     */

    if (isMatch) {

      statusEl.textContent =
        '✓ Correct!';

      statusEl.className =
        'correct';

      if (
        !hasEvaluatedCurrentChord
      ) {

        hasEvaluatedCurrentChord =
          true;

        totalAttempts++;
        correctAttempts++;

        totalResponseTime +=
          (
            Date.now() -
            chordStartTime
          ) / 1000;

        updateStatsDisplay();
      }

      /*
       * Automatically move forward.
       *
       * First redraw the current chord green, then replace it with
       * the next target.  Do not call updateFeedback() here because
       * updateFeedback() itself calls drawScore(), which previously
       * caused an unnecessary second render.
       */
      if (!window.__advanceScheduled) {

        window.__advanceScheduled = true;

        chordWasCompleted = true;

        // Show the completed chord in green.
        drawScore();

        setTimeout(() => {

          window.__advanceScheduled = false;

          currentProgressionStep++;

          activeMidiNotes.clear();

          chordWasCompleted = false;

          hasEvaluatedCurrentChord = false;

          chordStartTime = Date.now();

          clearKeyboardHighlights();

          // Replace the completed chord with the next target.
          drawScore();

          document.getElementById(
            'playedNotes'
          ).textContent = 'None';

        }, 500);
      }

      return;
    }

    /*
     * Incorrect note.
     */

    const hasWrongNote =
      active.some(
        midi =>
          !targetMidiSet.has(midi)
      );

    if (hasWrongNote) {

      statusEl.textContent =
        '✕ Incorrect Note';

      statusEl.className =
        'incorrect';

      /*
       * Count the attempt only once.
       */

      if (
        !hasEvaluatedCurrentChord
      ) {

        hasEvaluatedCurrentChord =
          true;

        totalAttempts++;

        updateStatsDisplay();
      }

    } else {

      statusEl.textContent =
        '… Incomplete Chord';

      statusEl.className = '';
    }
  }

  /*
   * ============================================================
   * CLEAR PIANO HIGHLIGHTS
   * ============================================================
   */

  function clearKeyboardHighlights() {

    Object.values(
      midiToKeyElMap
    ).forEach(
      keyEl =>
        keyEl.classList.remove(
          'active'
        )
    );
  }

  /*
   * ============================================================
   * STATS
   * ============================================================
   */

  function updateStatsDisplay() {

    document.getElementById(
      'statAttempts'
    ).textContent =
      totalAttempts;

    const accuracy =
      totalAttempts > 0
        ? Math.round(
            (
              correctAttempts /
              totalAttempts
            ) * 100
          )
        : 100;

    document.getElementById(
      'statAccuracy'
    ).textContent =
      `${accuracy}%`;

    const average =
      correctAttempts > 0
        ? (
            totalResponseTime /
            correctAttempts
          ).toFixed(1)
        : '0.0';

    document.getElementById(
      'statSpeed'
    ).textContent =
      `${average}s`;
  }

  /*
   * ============================================================
   * TRANSPOSE UP
   * ============================================================
   */

  document.getElementById(
    'transUpBtn'
  ).addEventListener(
    'click',
    () => {

      transposeSemitones++;

      updateTransposeDisplay();

      resetCurrentExercise();

    }
  );

  /*
   * ============================================================
   * TRANSPOSE DOWN
   * ============================================================
   */

  document.getElementById(
    'transDownBtn'
  ).addEventListener(
    'click',
    () => {

      transposeSemitones--;

      updateTransposeDisplay();

      resetCurrentExercise();

    }
  );

  function updateTransposeDisplay() {

    document.getElementById(
      'transValDisplay'
    ).textContent =
      `${
        transposeSemitones > 0
          ? '+'
          : ''
      }${transposeSemitones} ST`;
  }

  /*
   * ============================================================
   * RESET CURRENT EXERCISE
   * ============================================================
   */

  function resetCurrentExercise() {

    activeMidiNotes.clear();

    chordWasCompleted = false;

    clearKeyboardHighlights();

    currentProgressionStep = 0;

    hasEvaluatedCurrentChord =
      false;

    chordStartTime =
      Date.now();

    document.getElementById(
      'matchStatus'
    ).textContent =
      'Play target notes on your keyboard...';

    document.getElementById(
      'matchStatus'
    ).className = '';

    drawScore();
  }

  /*
   * ============================================================
   * FLOW MODE
   * ============================================================
   */

  document.getElementById(
    'flowModeBtn'
  ).addEventListener(
    'click',
    () => {

      isFlowModeActive =
        !isFlowModeActive;

      const btn =
        document.getElementById(
          'flowModeBtn'
        );

      if (
        isFlowModeActive
      ) {

        btn.textContent =
          'Flow Mode: ON 🌊';

        btn.style.background =
          '#059669';

        /*
         * Prevent duplicate intervals.
         */

        if (
          flowTimerInterval
        ) {

          clearInterval(
            flowTimerInterval
          );
        }

        flowTimerInterval =
          setInterval(
            () => {

              currentProgressionStep++;

              activeMidiNotes.clear();

              clearKeyboardHighlights();

              hasEvaluatedCurrentChord =
                false;

              chordStartTime =
                Date.now();

              drawScore();

              updateFeedback();

            },
            3000
          );

      } else {

        btn.textContent =
          'Flow Mode: OFF';

        btn.style.background =
          '#2563eb';

        if (
          flowTimerInterval
        ) {

          clearInterval(
            flowTimerInterval
          );

          flowTimerInterval =
            null;
        }
      }

    }
  );

  /*
   * ============================================================
   * METRONOME
   * ============================================================
   */

  document.getElementById(
    'toggleMetronomeBtn'
  ).addEventListener(
    'click',
    async () => {

      try {

        await Tone.start();

        if (
          Tone.context.state !==
          'running'
        ) {

          await Tone.context.resume();
        }

        const bpm =
          parseInt(
            document.getElementById(
              'bpmInput'
            ).value,
            10
          ) || 100;

        Tone.Transport.bpm.value =
          bpm;

        if (
          !isMetronomeRunning
        ) {

          metronomeEventId =
            Tone.Transport.scheduleRepeat(
              time => {

                clickSynth.triggerAttackRelease(
                  'C4',
                  '8n',
                  time
                );

              },
              '4n'
            );

          Tone.Transport.start();

          isMetronomeRunning =
            true;

          const btn =
            document.getElementById(
              'toggleMetronomeBtn'
            );

          btn.textContent =
            'Stop Click';

          btn.style.background =
            '#dc2626';

        } else {

          Tone.Transport.stop();

          if (
            metronomeEventId !== null
          ) {

            Tone.Transport.clear(
              metronomeEventId
            );

            metronomeEventId =
              null;
          }

          isMetronomeRunning =
            false;

          const btn =
            document.getElementById(
              'toggleMetronomeBtn'
            );

          btn.textContent =
            'Start Click';

          btn.style.background =
            '#2563eb';
        }

      } catch (error) {

        console.error(
          'Metronome error:',
          error
        );
      }

    }
  );

  /*
   * ============================================================
   * BPM
   * ============================================================
   */

  document.getElementById(
    'bpmInput'
  ).addEventListener(
    'change',
    event => {

      let bpm =
        parseInt(
          event.target.value,
          10
        ) || 100;

      bpm =
        Math.max(
          40,
          Math.min(
            240,
            bpm
          )
        );

      event.target.value =
        bpm;

      Tone.Transport.bpm.value =
        bpm;
    }
  );

  /*
   * ============================================================
   * NEXT CHORD
   * ============================================================
   */

  document.getElementById(
    'nextChordBtn'
  ).addEventListener(
    'click',
    () => {

      currentProgressionStep++;

      activeMidiNotes.clear();

      chordWasCompleted = false;

      clearKeyboardHighlights();

      hasEvaluatedCurrentChord=
        false;

      chordStartTime =
        Date.now();

      document.getElementById(
        'matchStatus'
      ).textContent =
        'Play target notes on your keyboard...';

      document.getElementById(
        'matchStatus'
      ).className = '';

      drawScore();

    }
  );

  /*
   * ============================================================
   * MIDI ACCESS
   * ============================================================
   */

  async function setupMIDI() {

    const status =
      document.getElementById(
        'midiStatus'
      );

    if (
      !navigator.requestMIDIAccess
    ) {

      status.textContent =
        'Web MIDI unavailable in this browser';

      return;
    }

    try {

      const midiAccess =
        await navigator.requestMIDIAccess();

      let inputCount = 0;

      for (
        const input
        of midiAccess.inputs.values()
      ) {

        inputCount++;

        input.onmidimessage =
          handleMIDIMessage;
      }

      if (
        inputCount > 0
      ) {

        status.textContent =
          `Connected ✓ (${inputCount} input${
            inputCount === 1 ? '' : 's'
          })`;

      } else {

        status.textContent =
          'MIDI available — no keyboard detected';
      }

      /*
       * Detect a MIDI device being connected later.
       */

      midiAccess.onstatechange =
        () => {

          let count = 0;

          for (
            const input
            of midiAccess.inputs.values()
          ) {

            count++;

            input.onmidimessage =
              handleMIDIMessage;
          }

          status.textContent =
            count > 0
              ? `Connected ✓ (${count} input${
                  count === 1
                    ? ''
                    : 's'
                })`
              : 'MIDI available — no keyboard detected';
        };

    } catch (error) {

      console.error(
        'MIDI access error:',
        error
      );

      status.textContent =
        'MIDI access denied/unavailable';
    }
  }

  /*
   * ============================================================
   * MIDI MESSAGE
   * ============================================================
   */

  function handleMIDIMessage(event) {

    const data =
      event.data;

    if (
      !data ||
      data.length < 2
    ) {
      return;
    }

    const status =
      data[0];

    const note =
      data[1];

    const velocity =
      data[2] || 0;

    const command =
      status >> 4;

    /*
     * Note On
     */

    if (
      command === 9 &&
      velocity > 0
    ) {

      handleNoteOn(note);

    }

    /*
     * Note Off
     */

    else if (
      command === 8 ||
      (
        command === 9 &&
        velocity === 0
      )
    ) {

      handleNoteOff(note);
    }
  }

  /*
   * ============================================================
   * AUDIO ENABLE
   * ============================================================
   */

  document.getElementById(
    'enableAudio'
  ).addEventListener(
    'click',
    async () => {

      try {

        await Tone.start();

        if (
          Tone.context.state !==
          'running'
        ) {

          await Tone.context.resume();
        }

        audioEnabled =
          true;

        const btn =
          document.getElementById(
            'enableAudio'
          );

        btn.textContent =
          'Audio Active ✓';

        btn.style.background =
          '#059669';

      } catch (error) {

        console.error(
          'Audio error:',
          error
        );
      }
    }
  );

  /*
   * ============================================================
   * SETTINGS CHANGE
   * ============================================================
   */

  [
    'keySelect',
    'clefSelect',
    'genreSelect',
    'chordsPerPage',
    'modeSelect',
    'rhythmSelect',
    'typeSelect',
    'inversionSelect'
  ].forEach(
    id => {

      document
        .getElementById(id)
        .addEventListener(
          'change',
          () => {

            /*
             * Stop active notes.
             */

            activeMidiNotes.clear();

            clearKeyboardHighlights();

            /*
             * Start the new exercise from step 1.
             */

            currentProgressionStep =
              0;

            hasEvaluatedCurrentChord =
              false;

            chordStartTime =
              Date.now();

            document.getElementById(
              'matchStatus'
            ).textContent =
              'Play target notes on your keyboard...';

            document.getElementById(
              'matchStatus'
            ).className = '';

            drawScore();
          }
        );

    }
  );

  /*
   * ============================================================
   * WINDOW RESIZE
   *
   * Debounced so dragging the browser window doesn't create
   * hundreds of SVG render operations.
   * ============================================================
   */

  let resizeTimer = null;

  window.addEventListener(
    'resize',
    () => {

      clearTimeout(
        resizeTimer
      );

      resizeTimer =
        setTimeout(
          () => {
            drawScore();
          },
          100
        );
    }
  );

  /*
   * ============================================================
   * CLEANUP
   * ============================================================
   */

  window.addEventListener(
    'beforeunload',
    () => {

      if (
        flowTimerInterval
      ) {

        clearInterval(
          flowTimerInterval
        );
      }

      if (
        metronomeEventId !== null
      ) {

        Tone.Transport.clear(
          metronomeEventId
        );
      }

    }
  );

  /*
   * ============================================================
   * INITIALISE
   * ============================================================
   */

  window.addEventListener(
    'load',
    async () => {

      /*
       * Draw immediately.
       */

      drawScore();

      /*
       * Then initialise MIDI.
       */

      await setupMIDI();

    }
  );

  /*
   * Initial draw for environments where load has already fired.
   */

  drawScore();

</script>

</body>
</html>
